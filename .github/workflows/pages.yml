name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.configure-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: configure-pages
        uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site
          cp *.html *.css *.js _site/
          cp -R assets downloads _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ needs.build.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
